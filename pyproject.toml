[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "midscene-python"
description = "Python SDK for Midscene: natural-language UI automation and E2E testing for Web and Android"
readme = "README.md"
license = "MIT"
keywords = ["automation", "AI", "web", "android", "testing", "ui", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5,<3.0",
    "playwright>=1.40.0,<2.0",
    "websockets>=12.0,<16.0",
    "opencv-python>=4.9.0,<5.0",
    "pillow>=10.1.0,<11.0",
    "numpy>=1.26.0,<2.0",
    "aiohttp>=3.9.0,<4.0",
    "loguru>=0.7.0,<1.0",
    "typer>=0.9.0,<1.0",
    "pyyaml>=6.0.1,<7.0",
    "httpx[socks]>=0.25.0,<1.0",
    "asyncio-mqtt",
    "pure-python-adb>=0.3.0dev0",
    "openai>=1.3.0,<2.0",
    "anthropic>=0.7.0,<1.0",
    "google-generativeai",
    "dashscope",
    "pyjwt[crypto]>=2.8.0",
    "json-repair>=0.30.0",
    "python-socketio>=5.11.0",
]
version = "0.2.0"

[project.optional-dependencies]
computer = [
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.4.0",
    "ruff>=0.6.1",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/ZhangMing520/midscene-python"
Repository = "https://github.com/ZhangMing520/midscene-python"
Documentation = "https://github.com/ZhangMing520/midscene-python/blob/master/docs/quickstart.md"
"Bug Tracker" = "https://github.com/ZhangMing520/midscene-python/issues"

[project.scripts]
midscene = "midscene.cli.index:main"

[tool.hatch.build.targets.wheel]
packages = ["midscene"]



[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by the formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    # StrEnum changes str()/format() output of the existing str+Enum members.
    "UP042",
    # PEP 695 type parameters change runtime typing behavior of public generics.
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Import order in these modules is load-bearing for circular imports.
"midscene/__init__.py" = ["I001"]
"midscene/core/__init__.py" = ["I001"]
"midscene/core/agent/agent.py" = ["I001"]
# Typer inspects callback annotations at runtime; older supported versions
# require typing.Optional instead of PEP 604 unions.
"midscene/cli/index.py" = ["UP045"]
# Late imports stay below the definitions to avoid circular imports.
"midscene/shared/agent_tools/__init__.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=midscene",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]